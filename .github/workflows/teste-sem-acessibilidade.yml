# Build de teste (não é release e não chega ao atualizador): Windows sem
# acessibilidade nativa do Godot e sem as extensões (Prism e Steam Audio).
# Serve para descobrir se algum desses componentes derruba um leitor de tela.
# O zip fica em "Artifacts" na página da execução.
name: Teste sem acessibilidade

on:
  workflow_dispatch:
  push:
    branches: [claude/teste-sem-acessibilidade]

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desligar a acessibilidade nativa
        run: |
          sed -i 's/^general\/accessibility_support=.*/general\/accessibility_support=2/' project.godot
          sed -i 's/^config\/version=.*/config\/version="0.0.1"/' project.godot
          grep -n 'accessibility_support\|config/version' project.godot

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Baixar Godot e modelos de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/$TAG"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${TAG}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${TAG}_export_templates.tpz"
          DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$DEST"
          unzip -q -j /tmp/templates.tpz \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' \
            'templates/version.txt' -d "$DEST"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Exportar (sem extensões)
        run: |
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Fawna.exe || true
          ls -la build/windows
          test -s build/windows/Fawna.exe
          test -s build/windows/Fawna.pck

      - uses: actions/upload-artifact@v4
        with:
          name: fawna-teste-sem-acessibilidade-windows
          path: build/windows
